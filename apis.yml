    type: APIReference
  - url: openapi/fyle-openapi.yml
    type: OpenAPI
  description: List, filter, retrieve, and upsert expenses across the organization.
    Admins read every employee's expenses (with rich filtering and pagination);
    spenders create their own expenses, create an expense from a receipt, and
    attach receipts. Base path uses the role segment - /admin/expenses or
    /spender/expenses.
