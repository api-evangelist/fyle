aid: fyle
url: https://raw.githubusercontent.com/api-evangelist/fyle/refs/heads/main/apis.yml
name: Fyle
kind: company
description: Fyle (now Sage Expense Management) is a spend and expense management
  platform known for real-time corporate card feeds that text employees for a
  receipt the moment a card is swiped, then auto-code the expense. The Fyle
  Platform APIs expose the same objects the product runs on - expenses, expense
  reports, advances, categories, projects, cost centers, employees, merchants,
  corporate cards and their transactions, files/receipts, and webhook
  subscriptions - as role-scoped REST resources (admin, spender, approver,
  common) under https://api.fylehq.com/platform/v1. Access is authenticated with
  OAuth 2.0 (refresh-token grant issuing short-lived Bearer access tokens), and
  list endpoints use PostgREST-style filtering with mandatory offset, limit, and
  order pagination.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
