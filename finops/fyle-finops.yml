description: >-
  FinOps view of Fyle (Sage Expense Management) spend. Fyle is a per-seat SaaS
  subscription billed on active users per month (billed annually), not a
  usage-metered API. The dominant cost driver is the count of active users -
  employees who create at least one expense or have a connected corporate card
  with at least one transaction in the month - multiplied by the tier rate
  (Growth or Business), or a negotiated Enterprise agreement. The Platform API is
  included with the subscription and is not billed per call, so API consumption
  does not itself generate incremental cost; it instead helps control cost by
  automating accounting export, reconciliation, and user provisioning.
notes: >-
  Because billing is per active user, the FinOps focus is on user activity and
  tier fit rather than API call volume. Per-unit rates are not reconciled here;
  verify on the Fyle pricing page. Enterprise pricing is negotiated.
