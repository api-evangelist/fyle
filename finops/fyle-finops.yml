meters:
- name: active_users
  description: Employees who create at least one expense or have a connected corporate card with at least one transaction in the month - the primary billed unit.
  unit: users
  aggregation: sum
  dimensions:
  - account
  - plan
  - month
- name: seats_provisioned
  description: Total employees onboarded (may exceed active users; onboarding all employees is free, only active users are billed).
  unit: users
  aggregation: max
  dimensions:
  - account
- name: api_calls
  description: Platform API requests. Included in the subscription and not billed per call; tracked for capacity and reconciliation, not cost.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - role
principles:
- name: Visibility
  description: Track active-user counts per month against provisioned seats so finance can see exactly what drives the invoice.
- name: Allocation
  description: Use cost centers, projects, and departments (synced via the API) to attribute expense volume - and therefore active-user activity - to the right internal owners.
- name: Optimization
  description: Right-size the plan tier to the features actually used, and deprovision or leave dormant users inactive so they do not count as active; automate accounting export via the API to cut manual finance labor.
- name: Accountability
  description: Review the active-user trend and tier fit at renewal; assign an owner for the Fyle subscription and its integration health.
