aid: fyle
name: Fyle
review:
  question: Does Fyle expose a documented public WebSocket API?
  answer: false
  date: '2026-07-03'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Fyle's public Platform API is
    request/response REST over HTTPS. Fyle's only server-push mechanism is
    outbound webhooks (subscriptions and scheduled_callbacks that HTTP POST to a
    consumer-configured URL) - server-to-endpoint HTTP, not a WebSocket or SSE
    stream on Fyle's own API. There is no bidirectional or streaming transport
    on Fyle's API to model.
findings:
  summary: |
    Fyle (now branded Sage Expense Management) does not publish a documented
    public WebSocket API. The Fyle Platform API is a role-scoped REST API served
    under https://api.fylehq.com/platform/v1 with a role segment (admin,
    spender, approver, common), authenticated via OAuth 2.0 using the
    refresh-token grant to obtain short-lived Bearer access tokens. List
    endpoints use a PostgREST-style convention with mandatory offset, limit, and
    order query parameters and field-level filters (e.g. id=eq.<uuid>). The only
    push mechanism is outbound webhooks - subscriptions and scheduled callbacks
    that Fyle POSTs to a configured HTTPS endpoint. No realtime, bidirectional,
    or streaming WebSocket (ws:// or wss://) endpoint is documented anywhere in
    Fyle's Platform API reference as of the review date.
  openSource: |
    Fyle's core product is proprietary SaaS, but Fyle publishes open-source
    client tooling on GitHub (github.com/fylein), including the Python Platform
    SDK (fyle-platform-sdk-py) and an integrations platform connector. The
    endpoint paths and HTTP verbs in this catalog are grounded in that
    open-source SDK; request/response field schemas are modeled
    representatively.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.fylehq.com/platform/v1
      documented: true
      note: Role-scoped Platform API (admin, spender, approver, common). Bearer OAuth 2.0.
    - protocol: OAuth Token
      scheme: https
      documented: true
      note: Refresh-token grant exchanged at Fyle's accounts/OAuth token endpoint for a short-lived access token.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Outbound webhook subscriptions and scheduled callbacks POST event payloads to a consumer-configured HTTPS endpoint. Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in Fyle's Platform API reference as of the review date.
