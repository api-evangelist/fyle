actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Fyle's own API. The Platform API is
    request/response REST with OAuth 2.0, and the only push transport is
    outbound HTTP webhooks (subscriptions / scheduled callbacks). No AsyncAPI
    document was created because there is no server-push streaming transport
    (WebSocket or SSE) on Fyle's API to model.
